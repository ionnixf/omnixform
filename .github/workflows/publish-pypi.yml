name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Select the explicit publication checkpoint
        required: true
        type: choice
        options:
          - do-not-publish
          - publish-to-pypi

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  SOURCE_DATE_EPOCH: "1767225600"

jobs:
  build:
    if: inputs.confirmation == 'publish-to-pypi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install verification and build tools
        run: python -m pip install -e ".[dev,all-formats,docs]" build twine
      - name: Verify source
        run: |
          ruff check src tests benchmarks
          ruff format --check src tests benchmarks
          mypy src tests --python-version 3.11
          pytest -m "not integration"
          mkdocs build --strict
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
