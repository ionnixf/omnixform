name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  SOURCE_DATE_EPOCH: "1767225600"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, types, and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,all-formats]"
      - name: Lint
        run: ruff check src tests benchmarks
      - name: Check formatting
        run: ruff format --check src tests benchmarks
      - name: Type check
        run: mypy src tests --python-version 3.11
      - name: Unit tests with coverage
        run: pytest -m "not integration" --cov=omnixform --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,all-formats]"
      - name: Run unit tests
        run: pytest -m "not integration"

  integration:
    name: External dependency integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install external converters
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg libreoffice pandoc
      - name: Install project
        run: python -m pip install -e ".[dev,all-formats]"
      - name: Run integration tests
        run: pytest -m integration

  package:
    name: Build and inspect distributions
    needs: [quality, tests, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Check package metadata
        run: |
          twine check --strict dist/*
          python scripts/inspect_distributions.py --expected-version 0.1.0
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  container:
    name: Build and smoke-test container
    needs: [quality, tests, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build without cache
        run: docker build --no-cache --tag omnixform:ci .
      - name: Verify unprivileged runtime and CLI
        run: |
          test "$(docker run --rm --entrypoint id omnixform:ci -u)" != "0"
          docker run --rm omnixform:ci --version
          docker run --rm omnixform:ci --help
