name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Use the private process in SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove secrets and personal data. Attach hostile samples only through an approved private channel.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Omnixform version
      placeholder: Output of omnix --version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Python and operating system
      placeholder: Python 3.11.15, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Relevant dependency versions
      description: Include FFmpeg, Pandoc, LibreOffice, or optional Python package versions when relevant.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      render: text
