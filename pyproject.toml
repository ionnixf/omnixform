[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnixform"
dynamic = ["version"]
description = "A local-first CLI for converting images, media, documents, text, and structured data"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Omnixform Contributors" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
    "markdown>=3.5",
]

[project.urls]
Homepage = "https://github.com/ionnixf/omnixform"
Repository = "https://github.com/ionnixf/omnixform"
Issues = "https://github.com/ionnixf/omnixform/issues"
Documentation = "https://github.com/ionnixf/omnixform/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0",
    "ruff>=0.15.0",
    "mypy>=1.10.0",
]
all-formats = [
    "pillow-avif-plugin>=1.0.0",   # AVIF support
    "pillow-heif>=0.11.0",         # HEIC/HEIF support
    "cairosvg>=2.7.0",             # SVG → raster
    "pillow-jxl-plugin>=1.3.8",    # JPEG XL support
]
docs = [
    "mkdocs>=1.5.0",
]

[project.entry-points."omnixform.adapters"]
pillow = "omnixform.adapters.images:ImageAdapter"
ffmpeg = "omnixform.adapters.multimedia:MultimediaAdapter"
text = "omnixform.adapters.text:TextAdapter"
structured_data = "omnixform.adapters.structured_data:StructuredDataAdapter"
cairosvg = "omnixform.adapters.vector:VectorAdapter"
pandoc = "omnixform.adapters.pandoc:PandocAdapter"
libreoffice = "omnixform.adapters.libreoffice:LibreOfficeAdapter"

[project.scripts]
omnix = "omnixform.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "omnixform.__version__" }

[tool.setuptools.package-data]
"omnixform" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: tests that require external dependencies (ffmpeg, pandoc, libreoffice)",
    "slow: tests that are intentionally slow",
]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG"]
ignore = ["B904", "SIM117", "N801", "N818", "UP042", "ARG001", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = ["PIL.*", "yaml", "markdown.*", "fastjsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["omnixform.adapters.images", "omnixform.adapters.multimedia"]
ignore_errors = true
